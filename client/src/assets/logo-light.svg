      <line x1="256" y1="266" x2="351" y2="211"/>
      <line x1="256" y1="266" x2="351" y2="321"/>
      <line x1="256" y1="266" x2="256" y2="376"/>
      <line x1="256" y1="266" x2="161" y2="321"/>
      <line x1="256" y1="266" x2="161" y2="211"/>
    </g>

    <circle cx="256" cy="156" r="15" fill="#FFFFFF"/>
    <circle cx="351" cy="211" r="15" fill="#FFFFFF"/>
    <circle cx="351" cy="321" r="15" fill="#FFFFFF"/>
    <circle cx="256" cy="376" r="15" fill="#FFFFFF"/>
    <circle cx="161" cy="321" r="15" fill="#FFFFFF"/>
    <circle cx="161" cy="211" r="15" fill="#FFFFFF"/>

    <circle cx="256" cy="266" r="30" fill="#FBBF24"/>
