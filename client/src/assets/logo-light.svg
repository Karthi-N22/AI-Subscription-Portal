    <g stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.55">
      <line x1="256" y1="156" x2="351" y2="211"/>
      <line x1="351" y1="211" x2="351" y2="321"/>
      <line x1="351" y1="321" x2="256" y2="376"/>
      <line x1="256" y1="376" x2="161" y2="321"/>
      <line x1="161" y1="321" x2="161" y2="211"/>
      <line x1="161" y1="211" x2="256" y2="156"/>
    </g>
    <g stroke="#FFFFFF" stroke-width="4">
